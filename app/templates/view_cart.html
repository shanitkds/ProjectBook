<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cart</h1><br>
    <table border="1">
        <tr>
            <th>product</th>
            <th>quantity</th>
            <th>Price</th>
            <th>Remove</th>
        </tr>
        {% for i in order%}
        <tr>
            <td>{{i.book.name}}</td>
            <td>{{i.quantity}}</td>
            <td>{{i.book.price}}</td>
            <td><a href="{% url 'remove' i.id %}">remove</a>
                <a href="{% url 'buy' i.book_id %}">Buy Now</a>
            </td>
        </tr>
        {% endfor %}
      
    </table>
</body>
</html>
